name: CI
on:
  pull_request:
  workflow_call:
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - run: dotnet test PartyKing.sln

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/ui/PartyKing.UI
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/ui/PartyKing.UI/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: src/ui/PartyKing.UI
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/ui/PartyKing.UI/package-lock.json
      - run: npm ci
      - id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      # No --with-deps: the runner already has every library Chromium needs, and that flag only adds CJK and X11 fonts
      # through apt (over 5 minutes). With the cache this is a no-op. If a runner image ever misses a library, Chromium
      # fails to start; add the flag back then.
      - run: npx playwright install chromium
      # Playwright starts the API (dotnet run) and Vite itself; see playwright.config.ts
      - run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            src/ui/PartyKing.UI/playwright-report
            src/ui/PartyKing.UI/playwright-report-demo
            src/ui/PartyKing.UI/test-results
          retention-days: 7
