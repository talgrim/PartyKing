name: CI
on:
  pull_request:
  workflow_call:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - run: dotnet test PartyKing.Application.Tests

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/ui/PartyKing.UI
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/ui/PartyKing.UI/package-lock.json
      - run: npm ci
      # src/App.test.js is a stale CRA leftover that fails, so run the Music tests only
      - run: npx vitest run src/components/Music
      - run: npm run build
