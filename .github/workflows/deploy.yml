name: Deploy to Fly.io
on:
  push:
    branches: [master]
  workflow_dispatch:

# One deploy at a time per workflow run: each app runs on a single machine with a SQLite volume
concurrency: deploy-group

jobs:
  test:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
      packages: read

  # packages: read lets the token restore the identity client packages (GitHub Packages) in the image build on Fly's
  # builder: it goes in as the build secret nuget_token, which the Dockerfile uses for that one command
  deploy:
    needs: test
    # Manual runs from other branches only run the tests, never deploy
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - run: flyctl deploy --remote-only --build-secret nuget_token=${{ secrets.GITHUB_TOKEN }}
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

  # The demo is a separate app built from the same image (see docs/deployment.md, "Demo app"). It deploys after the same
  # tests and does not wait for production, so a failure of one never blocks the other.
  deploy-demo:
    needs: test
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - run: flyctl deploy --remote-only --config fly.demo.toml --build-secret nuget_token=${{ secrets.GITHUB_TOKEN }}
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN_DEMO }}
