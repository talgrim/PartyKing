worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    access_log /dev/stdout;

    # Defines $client_ip and $forwarded_proto; written by entrypoint.sh, which only trusts Fly's
    # Fly-Client-IP / X-Forwarded-Proto headers when TRUST_FLY_CLIENT_IP=1 (otherwise a client could spoof them)
    include /tmp/forwarded-headers.conf;

    # Small by default; only the photo upload endpoint accepts big bodies
    client_max_body_size 1m;

    server {
        listen 8181;

        root /usr/share/nginx/html;

        # The API lives under /api; the prefix is stripped before it reaches Kestrel
        location /api/ {
            include /etc/nginx/security-headers.conf;
            include /etc/nginx/proxy.conf;
            rewrite ^/api/(.*)$ /$1 break;
            proxy_pass http://127.0.0.1:5000;
        }

        # Guests upload several photos at once: 100 MB per request (the API enforces 20 MB per file)
        location ~ ^/api/sessions/[0-9a-fA-F-]+/photos/ {
            client_max_body_size 100m;
            include /etc/nginx/security-headers.conf;
            include /etc/nginx/proxy.conf;
            rewrite ^/api/(.*)$ /$1 break;
            proxy_pass http://127.0.0.1:5000;
        }

        # Uploaded photos are user content: never let a browser run them as a page
        location ^~ /api/Images/ {
            include /etc/nginx/security-headers.conf;
            add_header Content-Security-Policy "default-src 'none'; sandbox" always;
            include /etc/nginx/proxy.conf;
            proxy_hide_header X-Content-Type-Options;
            rewrite ^/api/(.*)$ /$1 break;
            proxy_pass http://127.0.0.1:5000;
        }

        # Health endpoints are served on the internal port only
        location ~ ^/api/(health|alive)$ {
            return 404;
        }

        location /assets/ {
            include /etc/nginx/security-headers.conf;
            add_header Cache-Control "public, immutable" always;
            expires 1y;
            try_files $uri =404;
        }

        # Hashed assets are cached forever, so index.html must always be revalidated after a deploy
        location = /index.html {
            include /etc/nginx/security-headers.conf;
            add_header Cache-Control "no-cache" always;
        }

        # React router: unknown paths (/s/..., /callback, /admin) are served by the SPA
        location / {
            include /etc/nginx/security-headers.conf;
            try_files $uri /index.html;
        }
    }

    # Fly's health check (fly.toml) talks to this port; it is not exposed through the http_service
    server {
        listen 8182;

        location = /health {
            proxy_pass http://127.0.0.1:5000/health;
        }

        location / {
            return 404;
        }
    }
}
