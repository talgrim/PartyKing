worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    access_log /dev/stdout;

    # WebSocket upgrade for SignalR hubs (Connection is "upgrade" only when the client asked for it)
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Defines $client_ip and $forwarded_proto; written by entrypoint.sh, which only trusts Fly's
    # Fly-Client-IP / X-Forwarded-Proto headers when TRUST_FLY_CLIENT_IP=1 (otherwise a client could spoof them)
    include /tmp/forwarded-headers.conf;

    # Small by default; only the photo upload endpoint accepts big bodies
    client_max_body_size 1m;

    server {
        listen 8181;

        root /usr/share/nginx/html;

        # SignalR: long-lived WebSockets must not inherit the REST 15 s read timeout
        location /api/hubs/ {
            include /etc/nginx/security-headers.conf;
            include /etc/nginx/proxy.conf;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_connect_timeout 5s;
            proxy_read_timeout 1h;
            proxy_send_timeout 1h;
            proxy_buffering off;
            rewrite ^/api/(.*)$ /$1 break;
            proxy_pass http://127.0.0.1:5000;
        }

        # The API lives under /api; the prefix is stripped before it reaches Kestrel
        # A hung Kestrel must fail fast (504 after 15 s) instead of piling up the host player's 2 s state reports for 60 s each
        location /api/ {
            include /etc/nginx/security-headers.conf;
            include /etc/nginx/proxy.conf;
            proxy_connect_timeout 5s;
            proxy_read_timeout 15s;
            rewrite ^/api/(.*)$ /$1 break;
            proxy_pass http://127.0.0.1:5000;
        }

        # Guests upload several photos at once: 100 MB per request (the API enforces 20 MB per file)
        location ~ ^/api/sessions/[0-9a-fA-F-]+/photos/ {
            client_max_body_size 100m;
            include /etc/nginx/security-headers.conf;
            include /etc/nginx/proxy.conf;
            proxy_read_timeout 120s;
            proxy_send_timeout 120s;
            rewrite ^/api/(.*)$ /$1 break;
            proxy_pass http://127.0.0.1:5000;
        }

        # Uploaded photos are user content: never let a browser run them as a page
        location ^~ /api/Images/ {
            include /etc/nginx/security-headers.conf;
            add_header Content-Security-Policy "default-src 'none'; sandbox" always;
            include /etc/nginx/proxy.conf;
            proxy_hide_header X-Content-Type-Options;
            rewrite ^/api/(.*)$ /$1 break;
            proxy_pass http://127.0.0.1:5000;
        }

        # Health and metrics endpoints are served on the internal ports only
        location ~ ^/api/(health|alive|metrics)$ {
            return 404;
        }

        location /assets/ {
            include /etc/nginx/security-headers.conf;
            add_header Cache-Control "public, immutable" always;
            expires 1y;
            try_files $uri =404;
        }

        # Hashed assets are cached forever, so index.html must always be revalidated after a deploy
        location = /index.html {
            include /etc/nginx/security-headers.conf;
            add_header Cache-Control "no-cache" always;
        }

        # React router: unknown paths (/s/..., /callback, /admin) are served by the SPA
        location / {
            include /etc/nginx/security-headers.conf;
            try_files $uri /index.html;
        }
    }

    # Fly's health check (fly.toml) talks to this port; it is not exposed through the http_service
    server {
        listen 8182;

        location = /health {
            proxy_read_timeout 4s;
            proxy_pass http://127.0.0.1:5000/health;
        }

        location / {
            return 404;
        }
    }

    # Fly scrapes Prometheus metrics from this port (the [metrics] section in fly.toml); not exposed through the http_service
    server {
        listen 8183;

        location = /metrics {
            proxy_pass http://127.0.0.1:5000/metrics;
        }

        location / {
            return 404;
        }
    }
}
