worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    access_log /dev/stdout;

    # Fly's edge sets Fly-Client-IP and X-Forwarded-Proto; fall back to the direct peer (local docker run)
    map $http_fly_client_ip $client_ip {
        default $http_fly_client_ip;
        ""      $remote_addr;
    }
    map $http_x_forwarded_proto $forwarded_proto {
        default $http_x_forwarded_proto;
        ""      $scheme;
    }

    server {
        listen 8181;
        client_max_body_size 200m;

        root /usr/share/nginx/html;

        # The API lives under /api; the prefix is stripped before it reaches Kestrel
        location /api/ {
            rewrite ^/api/(.*)$ /$1 break;
            proxy_pass http://127.0.0.1:5000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $client_ip;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
        }

        location = /health {
            proxy_pass http://127.0.0.1:5000/health;
        }

        location /assets/ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            try_files $uri =404;
        }

        # React router: unknown paths (/s/..., /callback, /admin) are served by the SPA
        location / {
            try_files $uri /index.html;
        }
    }
}
