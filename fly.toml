# fly.toml app configuration file generated for partyking on 2026-10-23T16:59:42+02:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'partyking'
primary_region = 'fra'

[build]
  dockerfile = 'Dockerfile'

[env]
  # Fly's edge sets Fly-Client-IP / X-Forwarded-Proto; nginx may trust them only here
  TRUST_FLY_CLIENT_IP = '1'
  # Never Debug/Trace in production: EF Core and ASP.NET log every query and request at those levels
  Logging__LogLevel__Default = 'Information'
  Logging__LogLevel__Microsoft__AspNetCore = 'Warning'
  Logging__LogLevel__Microsoft__EntityFrameworkCore = 'Warning'
  SpotifySettings__RedirectUri = 'https://party.talgrim.dev/callback'
  # The mail about a guest's deletion request; the key is the secret MailSettings__ApiKey. The sender must be on the domain verified at Resend
  MailSettings__Sender = 'partyking-requests@talgrim.dev'
  MailSettings__Recipient = 'partyking@talgrim.dev'
  MailSettings__ReplyTo = 'partyking@talgrim.dev'
  # Accounts live in the identity service; the session cookie it sets on .talgrim.dev is only forwarded to it. The secret
  # Identity__WebhookSecret signs its account deletion webhook (a signed POST to /api/internal/events)
  Identity__BaseUrl = 'https://auth.talgrim.dev/'
  Identity__CookieName = '__Secure-talgrim.session'

[[mounts]]
  source = 'partyking_data'
  destination = '/data'

[http_service]
  internal_port = 8181
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = false
  min_machines_running = 1

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '20s'
    method = 'GET'
    # nginx serves /health on a separate internal port that the http_service does not expose
    port = 8182
    path = '/health'

[metrics]
  # nginx proxies this port to Kestrel's Prometheus endpoint; Fly shows it in its managed Grafana
  port = 8183
  path = '/metrics'

[[vm]]
  size = 'shared-cpu-2x'
  memory = '512mb'
